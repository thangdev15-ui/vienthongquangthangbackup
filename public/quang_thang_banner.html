<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quang Thắng Telecom Banner</title>
<style>
  :root{
    --navy-deep:#0a2a5e;
    --blue-mid:#0f5fc7;
    --blue-bright:#2f8bf0;
    --sky:#7fc4ff;
    --orange:#ff6a1a;
    --orange-light:#ffb066;
    --ink:#0a2a5e;
    --white:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{
    width:100%;
    min-height:760px;
  }
  body{
    background:transparent;
    font-family:'Segoe UI',Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    width:100vw;
    min-height:760px;
    overflow:auto;
  }
  .banner{
    position:relative;
    width:100vw;
    min-height:760px;
    border-radius:min(48vw,150px) min(48vw,150px) min(20vw,60px) min(20vw,60px);
    overflow:hidden;
    background:
      radial-gradient(140% 90% at 15% -5%, var(--blue-bright) 0%, transparent 55%),
      linear-gradient(165deg, var(--navy-deep) 0%, var(--blue-mid) 55%, #0d4aa0 100%);
    box-shadow:0 30px 60px rgba(10,42,94,0.35);
  }

  /* decorative rings, echoing the reference's overlapping-circle motif */
  .ring{
    position:absolute;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.18);
  }
  .ring--top{ position:absolute; width:220px; height:220px; top:-90px; left:-70px; border-color:rgba(255,255,255,0.28); }
  .ring--top-fill{
    position:absolute; width:150px; height:150px; top:-55px; left:-45px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--sky), var(--blue-bright) 70%);
    opacity:0.85;
  }
  .ring--bottom{ position:absolute; width:260px; height:260px; bottom:-110px; right:-90px; }
  .ring--bottom-fill{
    position:absolute; width:clamp(170px, 68vw, 230px); height:clamp(170px, 68vw, 230px); bottom:-78px; right:-72px; border-radius:50%;
    background:radial-gradient(circle at 65% 65%, var(--orange-light), var(--orange) 75%);
    opacity:0.9;
  }
  .dot{ position:absolute; border-radius:50%; background:rgba(255,255,255,0.5); }
  .dot1{ width:8px; height:8px; top:120px; right:34px; }
  .dot2{ width:5px; height:5px; top:150px; right:56px; background:rgba(255,255,255,0.3);}

  .content{
    position:relative;
    z-index:2;
    min-height:760px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:clamp(28px, 7vh, 46px) clamp(10px, 8vw, 26px) clamp(18px, 5vh, 30px);
  }

  .brand-logo{
    width:clamp(108px, 70vw, 168px);
    height:auto;
    margin-bottom:10px;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,0.25));
  }
  .sub-wordmark{
    color:rgba(255,255,255,0.75);
    font-size:clamp(8px, 3vw, 10px);
    letter-spacing:clamp(1px, 1vw, 2px);
    margin-top:2px;
  }

  .divider{
    display:flex; align-items:center; gap:clamp(4px, 2vw, 8px);
    color:rgba(255,255,255,0.65);
    font-size:10px;
    letter-spacing:clamp(0.5px, 1vw, 2px);
    margin:clamp(12px, 3vh, 18px) 0 10px;
  }
  .divider .line{ width:clamp(10px, 9vw, 26px); height:1px; background:rgba(255,255,255,0.4); }

  .headline{
    color:#fff;
    font-size:clamp(23px, 12vw, 34px);
    font-weight:800;
    line-height:1.28;
    max-width:250px;
  }
  .headline em{
    font-style:normal;
    color:var(--orange-light);
  }

  .features{
    width:100%;
    margin-top:clamp(18px, 5vh, 30px);
    display:flex;
    flex-direction:column;
    gap:clamp(12px, 2.2vh, 16px);
    text-align:left;
    max-width:240px;
  }
  .feature{
    display:flex;
    align-items:center;
    gap:clamp(6px, 3vw, 10px);
  }
  .feature .icon{
    flex:0 0 auto;
    width:clamp(26px, 12vw, 34px); height:clamp(26px, 12vw, 34px);
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center;
    color:var(--orange-light);
    border:1px solid rgba(255,255,255,0.2);
  }
  .feature .icon svg{
    width:clamp(14px, 5vw, 18px);
    height:clamp(14px, 5vw, 18px);
    stroke:currentColor;
    stroke-width:2.5;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .feature .txt{
    color:#fff;
    font-size:clamp(13px, 5vw, 17px);
    font-weight:700;
  }
  .contact{
    width:100%;
    max-width:250px;
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:9px;
    border-radius:18px;
    background:rgba(8,45,105,0.74);
    border:1px solid rgba(255,255,255,0.18);
    padding:12px 12px;
    text-align:left;
  }
  .contact-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
    color:#fff;
    font-size:clamp(10.5px, 4vw, 13px);
    font-weight:650;
    line-height:1.35;
  }
  .contact-row svg{
    width:15px;
    height:15px;
    flex:0 0 auto;
    margin-top:1px;
    stroke:var(--orange-light);
    stroke-width:2.2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .cta{
    padding-top:clamp(16px, 4vh, 26px);
  }
  .cta a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(135deg, var(--orange), #ff8c42);
    color:#fff;
    font-weight:700;
    font-size:clamp(11px, 4.5vw, 13.5px);
    padding:10px clamp(14px, 8vw, 26px);
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 12px 28px rgba(255,106,26,0.48);
  }
</style>
</head>
<body>

  <div class="banner">
    <div class="ring--top"></div>
    <div class="ring--top-fill"></div>
    <div class="ring--bottom"></div>
    <div class="ring--bottom-fill"></div>
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>

    <div class="content">
      <img class="brand-logo" src="/logoqt.png?v=4" alt="Quang Thắng Telecom">
      <div class="sub-wordmark">KẾT NỐI TIN CẬY</div>

      <div class="divider"><span class="line"></span>NHÀ PHÂN PHỐI<span class="line"></span></div>

      <div class="headline">THIẾT BỊ <em>CHÍNH HÃNG</em></div>

      <div class="features">
        <div class="feature"><div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div><div class="txt">Sản phẩm chính hãng</div></div>
        <div class="feature"><div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 18V6h3l3 4v8h-2"/><path d="M14 18H9"/><path d="M5 18H3V8h11"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></div><div class="txt">Giao hàng nhanh, toàn quốc</div></div>
      </div>

      <div class="contact">
        <div class="contact-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>435/26 Thống Nhất, TP.HCM</span></div>
        <div class="contact-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.2a2 2 0 0 1 2.1-.4c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 1.9Z"/></svg><span>0947.106.161</span></div>
      </div>

      <div class="cta"><a href="/thuong-hieu" target="_top">Xem thêm →</a></div>
    </div>
  </div>

</body>
</html>
